<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>masking-tool</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>マスキングツール</h1>
    </header>
    <main>
      <p>マスキングツールは、テキストをマスクするためのツールです。</p>

      <div class="container">
        <!-- 左側：入力欄 -->
        <div class="box">
          <label for="textInput">入力欄</label>
          <textarea
            id="textInput"
            placeholder="ここに文章を入力してください。"
          ></textarea>
        </div>

        <!-- 右側：出力欄（divに変更して装飾を効かせます） -->
        <div class="box">
          <label for="textOutput">出力欄</label>
          <div id="textOutput" style="white-space: pre-wrap">
            変換結果がここに表示されます。
          </div>
        </div>
      </div>

      <button type="button" id="maskButton">
        電話番号を検出・ハイライトする
      </button>

      <button type="button" id="copyButton">マスキング結果をコピー</button>
    </main>

    <footer>
      <p>© 2026 Masking Tool. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
